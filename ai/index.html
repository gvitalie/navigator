<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>navigator · PyPI browser</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/lib/marked.umd.js"></script>
    <style>
        * {
            box-sizing: border-box;
            font-family: system-ui, 'Segoe UI', Roboto, sans-serif;
        }
        body, html {
            overflow: hidden;
            margin: 0;
            padding: 0;
            background: #f5f9ff;
            height: 100vh;
            width: 100vw;
        }
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 8px;
        }
        .info-tag {
            font-size: 1.15rem;
            margin-bottom: 6px;
            color: #1e3c3f;
            letter-spacing: 0.3px;
        }
        .info-tag i {
            background: #d9f0ec;
            padding: 0 10px;
            border-radius: 40px;
        }
        .container {
            display: flex;
            flex-direction: row;
            width: calc(100vw - 30px);
            height: calc(100vh - 60px);
            box-sizing: border-box;
            gap: 12px;
        }
        /* left main panel */
        .content {
            display: flex;
            flex-direction: column;
            width: 75%;
            min-width: 400px;
            border: 1px solid #2e7d5e;
            border-radius: 24px;
            background: #ffffffd9;
            backdrop-filter: blur(3px);
            box-shadow: 0 12px 28px rgba(0, 40, 20, 0.2);
            overflow: hidden;
        }
        .header {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            min-height: 18%;
            background: linear-gradient(145deg, #e4f0e7, #cde4db);
            border-bottom: 1px solid #2e7d5e;
            padding: 18px 0 12px;
        }
        .search {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            width: 100%;
        }
        #search {
            line-height: 2.2;
            font-size: 1.3em;
            color: #14532d;
            background: #fffef0;
            border: 2px solid #1b4d3e;
            border-radius: 40px;
            text-align: center;
            box-shadow: 3px 3px 6px rgba(0,30,10,0.3);
            width: 70%;
            transition: 0.2s;
        }
        #search:focus {
            outline: none;
            border-color: #d48d2b;
            box-shadow: 0 0 0 3px #f7e9c3;
        }
        .description {
            flex: 1;
            padding: 28px 35px;
            overflow-y: auto;
            background: #fefef7;
            scroll-behavior: smooth;
            font-size: 1.05rem;
            line-height: 1.5;
            border-radius: 0 0 20px 20px;
        }
        .description pre {
            white-space: pre-wrap;
            word-wrap: break-word;
            background: #f0f5ea;
            padding: 18px;
            border-radius: 20px;
            border-left: 6px solid #226b52;
        }
        .description pre code {
            white-space: pre-wrap;
            font-family: 'JetBrains Mono', monospace;
        }
        .description img {
            max-width: 100%;
            height: auto;
            border-radius: 16px;
            box-shadow: 0 6px 12px #ccc;
        }
        /* right panel – navigator + index */
        .pagination {
            display: flex;
            flex-direction: column;
            width: 25%;
            min-width: 260px;
            border: 1px solid #2e7d5e;
            border-radius: 24px;
            background: #ffffffd9;
            backdrop-filter: blur(3px);
            overflow: hidden;
            box-shadow: 0 12px 28px rgba(0, 40, 20, 0.2);
        }
        .navigator {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: stretch;
            background: linear-gradient(145deg, #f4fbe7, #d0eedd);
            padding: 15px 8px 5px;
            border-bottom: 2px solid #34855e;
        }
        fieldset {
            border: 2px solid #0f553b;
            border-radius: 28px;
            background: #fafff2;
            margin: 0;
            padding: 10px 6px;
        }
        legend {
            font-size: 1.9em;
            font-weight: 600;
            color: #1f543e;
            text-shadow: 2px 2px 0 #c8e6d9;
            padding: 0 12px;
        }
        .nav-info {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            background: #bbe9db;
            color: #003323;
            font-weight: bold;
            font-size: 1.1rem;
            padding: 4px 16px;
            margin: 6px 0;
            border-radius: 36px;
            border: 1px solid #0b4d34;
        }
        .offset, .position {
            background: #fefae0;
            padding: 0 14px;
            border-radius: 40px;
            font-family: monospace;
            font-size: 1.2rem;
        }
        .m2, .m3, .m4, .m5, .m6 {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 3px;
            margin: 5px 0 0;
            background: #b7e4cd;
            border-radius: 50px;
            padding: 6px 6px;
            border: 1px solid #328f60;
        }
        .m2 span, .m3 span, .m4 span, .m5 span, .m6 span {
            font-size: 1.9rem;
            line-height: 1;
            cursor: pointer;
            transition: 0.1s ease;
            filter: drop-shadow(0 2px 2px #305f44);
            min-width: 32px;
            text-align: center;
        }
        .m2 span:hover, .m3 span:hover, .m4 span:hover, .m5 span:hover, .m6 span:hover {
            transform: scale(1.15);
            filter: drop-shadow(0 0 6px #f5b342);
        }
        .index {
            flex: 1;
            padding: 18px 14px;
            overflow-y: auto;
            background: #f5f7ea;
            display: flex;
            flex-direction: column;
            gap: 6px;
            border-radius: 0 0 20px 20px;
        }
        .index a {
            background: #eef7e9;
            padding: 10px 18px;
            border-radius: 40px;
            border: 1px solid #226b52;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 500;
            color: #0b4633;
            box-shadow: 2px 3px 6px rgba(0,30,0,0.1);
            transition: 0.1s;
            word-break: break-word;
            display: inline-block;
        }
        .index a:hover {
            background: #fedb9f;
            border-color: #b45400;
            transform: translateY(-2px);
        }
        .clicked {
            background: #d9b6ff !important;
            border: 2px solid #761be4 !important;
            font-weight: 700;
            color: #2b0b44;
        }
        .visited {
            background: #b1e6cc !important;
            border: 1px dashed #0e5f41;
            opacity: 0.8;
        }
        /* preset marker */
        .preset {
            filter: drop-shadow(0 0 8px #15884f);
        }
        /* small extras */
        .position, .offset {
            min-width: 70px;
            text-align: center;
        }
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #cde3d6;
        }
        ::-webkit-scrollbar-thumb {
            background: #146b48;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="info-tag"><i>👻 information by mouse click is accessible as silence, by anyone: O(1) navigation</i> ⛵</div>
    <div class="container">
        <!-- left: main content (search + description) -->
        <div class="content">
            <div class="header">
                <div class="search">
                    <input type="text" name="search" id="search"
                           placeholder="Sea🌊rch a_%" size="50" autocomplete="off">
                </div>
            </div>
            <div class="description" id="description">✨ enter a keyword (e.g. <strong>flask</strong>) and press ↵</div>
        </div>
        <!-- right: navigator + index list -->
        <div class="pagination">
            <div class="navigator">
                <fieldset>
                    <legend>🧭</legend>
                    <div class="nav-info">Offset: <div class="offset">0</div></div>
                    <div class="nav-info">Position: <div class="position">0</div></div>
                    <!-- dynamic multiplier rows m2 .. m6 will be injected here -->
                    <div class="m2" data-offset="0"></div>
                    <div class="m3" data-offset="0"></div>
                    <div class="m4" data-offset="0"></div>
                    <div class="m5" data-offset="0"></div>
                    <div class="m6" data-offset="0"></div>
                </fieldset>
            </div>
            <div class="index"></div>
        </div>
    </div>

    <script>
        (function() {
            // ----- generate navigator rows (10 spans each, with offset = i * 10**multiplier) -----
            function generate_navigator_row(containerClass, multiplier) {
                const container = document.querySelector(containerClass);
                if (!container) return;
                for (let i = 0; i < 10; i++) {
                    const span = document.createElement('span');
                    // first tile becomes purple later, but default all orange
                    span.textContent = `🟧`;
                    if (i === 0) span.textContent = '🟪';    // visually mark zero offset tile
                    let offset = i * (10 ** multiplier);
                    span.dataset.offset = offset;
                    span.title = `${i} × 10^${multiplier} = ${offset}`;
                    container.appendChild(span);
                }
            }

            // generate rows for multipliers 2 to 6 (i.e. 10^2 ... 10^6)
            generate_navigator_row('.m2', 2);
            generate_navigator_row('.m3', 3);
            generate_navigator_row('.m4', 4);
            generate_navigator_row('.m5', 5);
            generate_navigator_row('.m6', 6);

            // ----- navigator click/mouse controller -----
            function attachNavigatorEvents(spanList, rowElement) {
                spanList.forEach(span => {
                    span.addEventListener('click', (event) => {
                        // reset all spans in this row to orange
                        spanList.forEach(s => {
                            s.textContent = '🟧';
                        });
                        // mark clicked as purple
                        span.textContent = '🟪';
                        // update the row's data-offset attribute
                        rowElement.dataset.offset = span.dataset.offset;
                        // update global offset display
                        document.querySelector('.offset').innerHTML = getTotalOffset();
                        // fetch packages with new offset
                        get_pypkgs(getTotalOffset());
                    });

                    span.addEventListener('mouseover', () => {
                        document.querySelector('.position').innerHTML = span.dataset.offset;
                    });

                    span.addEventListener('mouseout', () => {
                        document.querySelector('.position').innerHTML = '0';
                    });
                });
            }

            // connect each row
            for (let i = 2; i <= 6; i++) {
                const row = document.querySelector(`.m${i}`);
                if (row) {
                    const spans = Array.from(row.querySelectorAll('span'));
                    attachNavigatorEvents(spans, row);
                }
            }

            // ----- helper: sum offsets from rows m2..m6 -----
            function getTotalOffset() {
                let total = 0;
                for (let i = 2; i <= 6; i++) {
                    const row = document.querySelector(`.m${i}`);
                    if (row && row.dataset.offset) {
                        total += Number(row.dataset.offset);
                    }
                }
                return total;
            }

            // ----- generate index links from data (mock backend, but respects offset & search) -----
            function generate_links(data) {
                const index = document.querySelector('.index');
                index.innerHTML = '';
                if (!data.pypkgs || data.pypkgs.length === 0) {
                    index.innerHTML = '<div style="padding:1em;color:#444;">✨ no packages</div>';
                    return;
                }
                data.pypkgs.forEach(pkg => {
                    let link = document.createElement('a');
                    // pkg is array like ["package-name"]
                    let pkgName = Array.isArray(pkg) ? pkg[0] : pkg;
                    link.href = `https://pypi.org/pypi/${pkgName}/json`;   // real PyPI json endpoint
                    link.textContent = pkgName;
                    link.target = '_blank';   // open in new tab (avoid losing navigator state)
                    link.rel = 'noopener';
                    index.appendChild(link);
                });
                index.scrollTop = 0;
            }

            // ----- fetch description from PyPI (real API) and render markdown -----
            function get_pypkg_info(pkgName) {
                let descriptionDiv = document.getElementById('description');
                const url = `https://pypi.org/pypi/${pkgName}/json`;

                fetch(url)
                    .then(response => {
                        if (!response.ok) {
                            descriptionDiv.innerHTML = `❌ Package not found (${response.status})`;
                            throw new Error(`HTTP ${response.status}`);
                        }
                        return response.json();
                    })
                    .then(data => {
                        if (data?.info?.description) {
                            descriptionDiv.innerHTML = marked.parse(data.info.description);
                        } else {
                            descriptionDiv.innerHTML = '📄 No description available.';
                        }
                        descriptionDiv.scrollTop = 0;
                    })
                    .catch(err => {
                        console.warn('Fetch error:', err);
                        descriptionDiv.innerHTML = `⚠️ error loading description.`;
                    });
            }

            // ----- attach click handlers to index links (mark visited/clicked) -----
            function parse_links() {
                const links = document.querySelectorAll('.index a');
                links.forEach(link => {
                    link.addEventListener('click', function (event) {
                        event.preventDefault();  // avoid actual navigation, we fetch manually
                        // remove 'clicked' from all, mark previous clicked as visited
                        links.forEach(l => {
                            if (l.classList.contains('clicked')) {
                                l.classList.add('visited');
                            }
                            l.classList.remove('clicked');
                        });
                        this.classList.remove('visited');
                        this.classList.add('clicked');

                        // extract package name from textContent
                        const pkgName = this.textContent.trim();
                        get_pypkg_info(pkgName);
                    });
                });
            }

            // ----- preset navigator colors based on backend preset array (digits) -----
            function preset_navigator(presetDigits) {
                // presetDigits: array of length 7? we use indices 2..6 (multiplier positions)
                // the digits correspond to which tile (0-9) should be highlighted in each row.
                for (let i = 2; i <= 6; i++) {
                    const row = document.querySelector(`.m${i}`);
                    if (!row) continue;
                    const spans = Array.from(row.querySelectorAll('span'));
                    const presetIndex = presetDigits[i] ?? 0;  // safety
                    spans.forEach((span, idx) => {
                        // reset any special marker, but keep purple if it's the current click? we use class preset
                        span.classList.remove('preset');
                        // only change color if it's not already purple (clicked) ?
                        // but we want to show preset as green (if not clicked)
                        if (span.textContent !== '🟪') {
                            span.textContent = '🟧';   // revert to orange
                        }
                    });
                    // mark the preset tile (if not clicked we set to green)
                    if (spans[presetIndex]) {
                        spans[presetIndex].classList.add('preset');
                        if (spans[presetIndex].textContent !== '🟪') {
                            spans[presetIndex].textContent = '🟩';   // preset indicator
                        }
                    }
                }
            }

            // ----- fetch package list from *simulated* backend (frontend-only mock) -----
            // Because this is a static demo, we generate mock data based on search keyword and offset.
            // It mimics the backend sqlite response structure.
            function get_pypkgs(offset) {
                const keyword = document.getElementById('search').value.trim() || '%';
                // mock database: generate a list of 100 package names (alphabetical + filter)
                // full package list (top 200 pypi names for demo)
                const basePackages = [
                    'flask', 'django', 'requests', 'numpy', 'pandas', 'matplotlib', 'scipy',
                    'click', 'jinja2', 'werkzeug', 'urllib3', 'botocore', 'boto3', 'pyyaml',
                    'cryptography', 'setuptools', 'pip', 'wheel', 'certifi', 'idna', 'charset-normalizer',
                    'six', 'python-dateutil', 'pytz', 'tzdata', 'awscli', 'boto', 's3transfer',
                    'jmespath', 'docutils', 'pyparsing', 'packaging', 'pillow', 'cycler', 'kiwisolver',
                    'contourpy', 'fonttools', 'numpy', 'pandas', 'scipy', 'sqlalchemy', 'alembic',
                    'psycopg2', 'pymongo', 'redis', 'celery', 'kombu', 'vine', 'billiard',
                    'amqp', 'pyjwt', 'passlib', 'bcrypt', 'paramiko', 'cffi', 'pycparser',
                    'markupsafe', 'mako', 'flask-sqlalchemy', 'flask-login', 'flask-wtf', 'wtforms',
                    'flask-mail', 'flask-admin', 'flask-migrate', 'flask-script', 'flask-cors',
                    'gunicorn', 'uvicorn', 'fastapi', 'pydantic', 'starlette', 'httpx', 'httpcore',
                    'rfc3986', 'sniffio', 'anyio', 'typing-extensions', 'pytest', 'coverage',
                    'tox', 'virtualenv', 'pipenv', 'poetry', 'black', 'flake8', 'mypy', 'isort',
                    'autoflake', 'pre-commit', 'sphinx', 'sphinx-rtd-theme', 'mistune', 'markdown',
                    'beautifulsoup4', 'lxml', 'html5lib', 'soupsieve', 'pyquery', 'selenium',
                    'splinter', 'playwright', 'robotframework', 'appium', 'pyautogui', 'pynput',
                    'keyboard', 'mouse', 'pygetwindow', 'opencv-python', 'pillow', 'nltk',
                    'textblob', 'pattern', 'spacy', 'transformers', 'torch', 'tensorflow', 'keras',
                    'jupyter', 'notebook', 'ipython', 'ipykernel', 'jupyter-core', 'nbconvert',
                    'nbformat', 'traitlets', 'jupyter-client', 'jupyter-console', 'qtconsole',
                    'spyder', 'pyqt5', 'pyside2', 'tk', 'wxpython', 'kivy', 'dearpygui',
                    'remi', 'pywebview', 'pyinstaller', 'cx-freeze', 'py2exe', 'py2app',
                    'nuitka', 'cython', 'numba', 'dask', 'distributed', 'bokeh', 'holoviews',
                    'panel', 'streamlit', 'dash', 'plotly', 'chart-studio', 'cufflinks',
                    'pygal', 'altair', 'vega-datasets', 'geopandas', 'shapely', 'fiona',
                    'pyproj', 'cartopy', 'basemap', 'folium', 'mapbox', 'mapnik', 'osmnx',
                    'networkx', 'igraph', 'python-louvain', 'community', 'powerlaw',
                    'scikit-learn', 'sklearn', 'xgboost', 'lightgbm', 'catboost',
                    'imbalanced-learn', 'yellowbrick', 'eli5', 'lime', 'shap', 'interpret',
                    'h2o', 'optuna', 'hyperopt', 'ray', 'tune', 'modin', 'vaex', 'polars'
                ].map((v, i) => v + (i > 50 ? String(i) : '')); // make unique

                // filter by keyword (if not '%')
                let filtered = basePackages;
                if (keyword !== '%') {
                    const lowerKeyword = keyword.toLowerCase();
                    filtered = basePackages.filter(p => p.includes(lowerKeyword));
                }

                // paginate: offset to offset+99 (or fewer)
                const start = Number(offset) || 0;
                const page = filtered.slice(start, start + 100);

                // package list in format [[name], [name], ...]
                const pypkgs = page.map(p => [p]);

                // compute a "preset" = total number of packages (or some derived digits)
                const totalCount = filtered.length;
                // convert totalCount to a string, pad to 7 digits, then split, reverse? (as in original)
                let presetStr = totalCount.toString().padStart(7, '0').split('').reverse().map(Number);
                // presetStr example: [3,2,1,0,0,0,0] for 123 packages? We need indices 2..6
                // for rows m2..m6: digits for 10^2..10^6 (positions 2,3,4,5,6)
                while (presetStr.length < 7) presetStr.push(0); // ensure length 7

                const response = {
                    pypkgs: pypkgs,
                    preset: [totalCount]  // mimic original: preset[0] is total count
                };

                generate_links(response);
                parse_links();

                // now extract digits for rows 2..6 from reversed string (same logic as original)
                // original: preset.padStart(7,0).split('').reverse().map(digit => Number(digit))
                // we have reversed digits: presetStr[0] is units, presetStr[1] tens, ..., presetStr[6] millions
                // our rows: m2 (10^2) => hundreds => index 2 (0-based from units): hundreds digit = presetStr[2]
                // m3 (10^3) => thousands => index 3, etc.
                const presetDigits = presetStr;  // already reversed: index 0=1s, 1=10s, 2=100s, 3=1000s, 4=10000s,5=100000s,6=1e6s
                preset_navigator(presetDigits);
            }

            // ----- wire search + enter / escape -----
            const searchInput = document.getElementById('search');
            searchInput.addEventListener('keydown', (event) => {
                if (event.key === 'Enter') {
                    event.preventDefault();
                    // reset navigator offsets? (optional, we set offset to 0)
                    // reset data-offset for rows to 0 and re-sync tiles (except first tile purple)
                    for (let i = 2; i <= 6; i++) {
                        const row = document.querySelector(`.m${i}`);
                        if (row) {
                            row.dataset.offset = 0;
                            const spans = Array.from(row.querySelectorAll('span'));
                            spans.forEach((span, idx) => {
                                span.textContent = idx === 0 ? '🟪' : '🟧';   // first tile purple (offset 0)
                            });
                        }
                    }
                    document.querySelector('.offset').innerHTML = '0';
                    get_pypkgs(0);
                }
                if (event.key === "Escape") {
                    searchInput.value = "";
                }
            });

            // initial load with keyword '%' (empty search shows many)
            get_pypkgs(0);

            // set initial offset display
            document.querySelector('.offset').innerHTML = '0';
            // focus input
            searchInput.focus();

            // make getTotalOffset globally reachable for offset display
            window.getTotalOffset = getTotalOffset; // used inside click handler
        })();
    </script>
    <!-- extra comments: keep original spirit -->
    <!-- 💋 Kiss = keep it stupid simple. [Baby steps ...] -->
    <!-- PRO BONO PUBLICO : backend snippet in comment -->
</body>
</html>
